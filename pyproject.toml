[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-drift"
version = "0.1.0"
description = "Offline heuristic checks for stale repository instructions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
instruction-drift = "instruction_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
